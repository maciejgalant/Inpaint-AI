name: Validate QGIS plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate plugin source
        run: python scripts/validate_plugin.py

      - name: Build QGIS plugin ZIP
        run: python scripts/build_plugin_zip.py

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: InpaintAI-QGIS-plugin
          path: dist/InpaintAI.zip
